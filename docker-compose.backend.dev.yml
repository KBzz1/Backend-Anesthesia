# 热更新开发模式
# 使用: docker-compose -f docker-compose.backend.yml -f docker-compose.backend.dev.yml up -d backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: anesthesia-backend-app-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 18080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/anesthesia
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: medical310
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      STOMP_CONSUMER_ENABLED: "false"
      STOMP_SERVER_URL: ws://anesthesia-backend-app:18080/ws
      DEVICE_BINDING_URL: http://anesthesia-backend-app:18080/device/binding/device/
      JWT_SECRET: Gvq3qwTLtylD/thEZikRdVUU2c5dv1GW+ZpC3BJDwOLU+8f22qPhFA5YXnRalpMz92HD3YiCCFjhyLM0mYGn8A==
    ports:
      - "18080:18080"
    volumes:
      - ./backend/src:/workspace/src:rw
    working_dir: /workspace
