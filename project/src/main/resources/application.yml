mybatis:
  # Mapper XML 文件路径（resources目录下的mapper文件夹）
  mapper-locations: classpath:mapper/*.xml
  # 实体类所在包（用于别名简化，比如 Patient 就能直接写成 <resultMap type="Patient">）
  type-aliases-package: com.example.entity
  configuration:
    # 开启数据库下划线命名自动匹配 Java 驼峰命名（birth_year -> birthYear）
    map-underscore-to-camel-case: true
    # SQL调试日志打印到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


