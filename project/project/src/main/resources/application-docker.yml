server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: anesthesia-base
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://anesthesia-postgres:5433/anesthesia}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:medical310}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:anesthesia-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

mqtt:
  broker: ${MQTT_BROKER:tcp://anesthesia-mqtt:1883}
  username: ${MQTT_USERNAME:310}
  password: ${MQTT_PASSWORD:medical310}
  clientId: ${MQTT_CLIENT_ID:medical}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
