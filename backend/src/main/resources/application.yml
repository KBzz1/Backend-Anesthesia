server:
  port: ${SERVER_PORT:18080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:anesthesia-refactor}
  jackson:
    time-zone: GMT+8
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/anesthesia}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:medical310}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

stomp:
  consumer:
    enabled: ${STOMP_CONSUMER_ENABLED:false}
  server:
    url: ${STOMP_SERVER_URL:ws://127.0.0.1:18080/ws}
  # 订阅特定设备：/data/sub/{deviceId}，deviceId 是设备MAC地址
  # 订阅所有设备：/data/sub/all
  topic: ${STOMP_TOPIC:/data/sub/5A:48:68:5E:5B:FA}
  # 设备MAC地址（用于从绑定接口查询surgeryId）
  device-id: ${STOMP_DEVICE_ID:5A:48:68:5E:5B:FA}
  # 绑定查询间隔（毫秒），默认5秒
  binding-check-interval: ${STOMP_BINDING_CHECK_INTERVAL:5000}

device:
  binding:
    url: ${DEVICE_BINDING_URL:http://127.0.0.1:18080/device/binding/device/}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.medical.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

auth:
  enabled: false
  shared-secret: ""
  header: Authorization
  bearer-prefix: "Bearer "
  ignore-paths: /error,/actuator/**

jwt:
  secret: ${JWT_SECRET:Gvq3qwTLtylD/thEZikRdVUU2c5dv1GW+ZpC3BJDwOLU+8f22qPhFA5YXnRalpMz92HD3YiCCFjhyLM0mYGn8A==}
  expiration: ${JWT_EXPIRATION:18000000}
logging:
  file:
    name: ${LOGGING_FILE_NAME:app.log}
    path: ${LOGGING_FILE_PATH:.}
  level:
    root: INFO
    com.medical: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.springframework.web.socket: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p %5pid --- [%15.15t] %-40.40logger{39} : %m%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p %5pid --- [%15.15t] %-40.40logger{39} : %m%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
